name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild once a year so the copyright year in the footer stays current.
  schedule:
    - cron: "0 6 1 1 *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install, build and upload site
        uses: withastro/action@v6
        with:
          node-version: 24

      # Fails on missing pages, broken links, unreplaced tokens, em dashes,
      # third-party resources or app pages built while the flag is off.
      # A failure here stops the deploy job below from running.
      - name: Check built site
        run: npm run check

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
